name: Update plugin index

# Keeps index.json in sync with plugins/<id>/ folders on every push to main.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate index.json
        run: node scripts/generate-plugin-index.js . Sylviromi/pragma-plugins index.json
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: regenerate plugin index'
